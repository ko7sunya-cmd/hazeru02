# 世界の根。すべての場所はここから枝分かれする。
- id: shinjuku
  type: world
  parent: null
  name: 新宿・水上都市
  reading: しんじゅく・すいじょうとし
  en: Shinjuku, the Waterborne City
  tags: [眺望, 生活感, 水音]
  access: open
  best_time: いつでも
  name_origin: >-
    沈みはじめる前の地名を、そのまま使い続けている。名前を変えようという話は何度か出たが、
    「水の上でも新宿は新宿だ」という声がいつも勝った。
  summary: 水の上に、もうひとつの新宿がある。
  body: |-
    百年ほどかけてゆっくりと水に沈んだ新宿は、いまも人が暮らす街として続いている。
    杭の上に積み上げた上層の新都市、水面に浮かぶ境界の市場、封水されて水底に眠る下層の旧新宿。三つの層は降り筒と階段と舟でつながり、住人は毎日あたりまえのように行き来している。

    地図の点を選ぶと、その場所の解説が開きます。層や楽しみ方で絞り込みながら、気になる場所から歩いてみてください。
