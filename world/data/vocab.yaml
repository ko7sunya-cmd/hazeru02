# 語彙集。場所データで使える値はここに載っているものだけ。
# 新しいタグを使いたいときは、先にここへ足す（ビルド時にチェックされる）。

# 場所の種類
types:
  world: 世界
  layer: 層
  district: 街区
  spot: スポット
  route: 道・乗り物

# 楽しみ方の分類（スポット・道に付ける）。color は地図のピンの色。
categories:
  daily:
    label: 日常
    description: 住人の暮らしがそのまま見える場所
    color: "#f2b56b"
  sightseeing:
    label: 観光
    description: 訪れる人のために開かれた、見て歩く場所
    color: "#5fd4e8"
  landmark:
    label: 名所
    description: 街の象徴。誰もが知っていて、目印になる場所
    color: "#f4ecd2"
  mystic:
    label: 神秘
    description: 理由はわからないが、不思議で、少しだけ心が静まる場所
    color: "#b79cf5"

# 立ち入り
access:
  open: 自由に出入りできる
  limited: 条件つきで入れる
  closed: 立入制限（穏やかな理由のみ）

# 雰囲気タグ。グループは整理のためだけで、データ側ではタグ名だけを書く。
tags:
  光:
    - 木漏れ日の水   # 水を通した揺れる光
    - 青い光
    - 灯り
    - ネオン
    - 発光
    - 夕焼け
    - 水面の反射
  音:
    - 水音
    - 音楽
    - 風の音
    - 静けさ
    - 賑わい
  肌ざわり・匂い:
    - 潮の匂い
    - 湯気
    - 風通し
    - 緑
  過ごし方:
    - 待ち合わせ
    - 眺望
    - ひとり向き
    - 子ども連れ
    - 朝が本番
    - 夜が本番
  気配:
    - 生活感
    - 懐かしい
    - 神秘
    - 手仕事
    - 猫

# キャラクターの表情ID。台本（courses）ではここにあるIDを指定する。
# キャラ側にその表情の画像が無いあいだは、normal の画像で代用される。
expressions:
  normal: 通常
  smile: 笑う
  surprise: 驚く
  quiet: 静か
  tease: いたずら

# コースの time（自由な文字）を、イラストの時間帯（art のキー）へ対応づける表。
# コースで新しい time を使うときは、ここへ足す（ビルド時にチェックされる）。
time_slots:
  morning: [朝, 午前, 昼前, 雨上がりの朝]
  day: [昼, 昼下がり, 午後]
  dusk: [夕方, 夕方前, 日没前, 日没]
  night: [夜]
