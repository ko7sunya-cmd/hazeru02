# コース: ひまりの市場案内
# 水上マーケットを、東から西へ。初めての人向けの、昼から夕方までの王道コース。
# 表情は normal / smile / tease / quiet を使う。
# echoes は、別のコースを歩き終えた人にだけ、その場所で追加される数行（localStorage に歩いた記録を持つ）。
id: himari-market-1
character: himari
title: ひまりの市場案内
subtitle: はじめてのみぎわ市、昼から夕方まで
duration: 約10分
summary: 水上バスのりばから泳ぎ段まで。みぎわ市の案内人と、初めての水上マーケットを東から西へ歩く。
steps:
  - place: bd-waterbus
    time: 昼前
    lines:
      - {who: narration, text: 水上バスが桟橋に着くと、屋根のついた待合所の前で、黄色いリボンの案内人が大きく手を振っていた。}
      - {expr: smile, text: 「ようこそ、みぎわ市へ！　案内所の千草ひまりです。今日は、お客さん専属のガイドだよ！」}
      - {expr: normal, text: 「まず、約束ひとつ。歩く順番は、東から西。潮の流れと同じ向きだから、疲れにくいの」}
      - {expr: tease, text: 「それと、おなかは空けておいてね。今日は、食べ歩きが半分くらいを占めます」}
      - {expr: normal, text: 「あ、時刻表のいちばん下の行は、見ないで。あれは、見はじめると帰れなくなるから」}
      - {expr: smile, text: 「それじゃ、出発！　最初は、赤鶴から！」}

  - place: bd-crane
    time: 午前
    echoes:
      - after: shiori-delivery-1
        label: 朝の話
        lines:
          - {expr: normal, text: 「そういえば、配達人のしおりちゃんが、今朝ここで荷物を受け取ってたよ。あの子、赤鶴の首の向きを、毎年気にしてるの」}
    lines:
      - {who: narration, text: 舟溜まりの真ん中で、赤い長い首のクレーンが、木箱をゆっくり持ち上げている。}
      - {expr: smile, text: 「ここが赤鶴！　初めてのお客さんは、まずここで首を上げて、びっくりする係なの」}
      - {expr: normal, text: 「見て、あの首の角度。重い箱を持ち上げてるのに、笛の合図ひとつで、ぴたっと止まるんだよ」}
      - {expr: tease, text: 「待ち合わせの目印にもなるの。『赤鶴の足元で』って言えば、どの舟の人にも通じる」}
      - {expr: normal, text: 「降り筒の第一口も、すぐそこ。下の街へは、また後でね。……ちょっとだけ、見ていく？」}
    detour:
      place: bd-orizutsu
      label: 降り筒・第一口をのぞく
      lines:
        - {who: narration, text: 塔の看板の下で、ガラスの籠が、水面の下へ静かに降りていく。}
        - {expr: normal, text: 「ここから、下層の旧駅舎まで一直線。料金はなし。朝夕は通勤の列で、昼は観光の列」}
        - {expr: smile, text: 「下に行くのは、今日は我慢！　でも、降りていく籠を見送るのも、けっこう贅沢でしょ？」}

  - place: bd-ring-stage
    time: 昼
    lines:
      - {who: narration, text: 円形の浮き台が、潮にあわせて、ゆっくり上下している。昼の輪舞台は、荷さばきの人たちが木箱を積み替える、働く場所だ。}
      - {expr: normal, text: 「ここは、輪舞台。昼は荷さばき場だけど、夕方になると、誰かが楽器を持って集まってくるの」}
      - {expr: smile, text: 「潮が動くと、舞台ごと揺れるでしょ？　それに合わせて踊る『潮踊り』は、境界でしか見られないんだ」}
      - {expr: tease, text: 「夕方に戻ってきたら、特等席を教えてあげる。……夕市の準備、のぞいてく？」}
    detour:
      place: bd-lantern
      label: 灯籠舟の準備をのぞく
      lines:
        - {who: narration, text: 輪の間の南の水面で、小舟の主たちが、灯籠に小さな火袋を取りつけている。}
        - {expr: normal, text: 「日没の鐘が鳴ると、ここに灯籠舟が集まって、水の上の夜市が始まるの」}
        - {expr: smile, text: 「甘いものと、小さな灯りと、灯魚を模した飴細工。お土産の定番だよ」}

  - place: bd-nozoki
    time: 昼下がり
    echoes:
      - after: tsuyu-night-1
        label: 夜の話
        lines:
          - {expr: quiet, text: 「この床の下の大広間、夜は、夜番のつゆちゃんが見回ってるんだって。夜に覗くと、青い灯りがついてるって聞いたよ」}
    lines:
      - {who: narration, text: 青い屋根の茶屋の座敷で、床の半分がガラスになっている。真下の水中に、沈んだ旧駅舎の屋根が、苔をまとって横たわっていた。}
      - {expr: smile, text: 「ここが、覗き床茶屋！　おすすめは、濾し貝の出汁で炊いたお粥。急いでいる人には、出せないメニューです」}
      - {expr: normal, text: 「ガラスの床の下を見て。あれが、下の街の屋根。昼どきは、光がまっすぐ水に差し込んで、魚の影が、屋根の上を通っていくの」}
      - {expr: quiet, text: 「……こうして座ると、時間が、ゆっくりになるでしょ。案内人は、ここで一回、息をつくの」}
      - {expr: tease, text: 「それとね、ガラスの下をじっと見てると、下の人と目が合うことがあるの。たいてい、手を振ってくれるから、振り返してあげて」}
    detour:
      place: lo-concourse
      label: 床の真下の大広間をのぞく
      lines:
        - {who: narration, text: ガラスの下、旧駅舎の高い天井の下で、誰かがこちらを見上げて、小さく手を振っている。}
        - {expr: smile, text: 「ほら、振り返して！　お客さんが手を振ると、下の人も、ちょっと嬉しそうなの」}
        - {expr: normal, text: 「あそこが旧駅舎の大広間。入場無料で、一日じゅういられるよ。降り筒で、いつか行ってみてね」}

  - place: bd-shizumimono
    time: 午後
    lines:
      - {who: narration, text: 台の上に、洗われた古い切符や、止まった腕時計、看板から外れた一文字が、小さな札をつけて並んでいる。}
      - {expr: normal, text: 「沈み物市。潜守さんたちが、手入れの途中で見つけた古い品を売ってるの」}
      - {expr: smile, text: 「お土産探しなら、ここ。切符一枚から買えるよ。『どの建物の何階で出てきたか』も、売り手さんが教えてくれる」}
      - {expr: tease, text: 「私のおすすめは、看板の文字！　一文字ずつ集めると、昔の店の名前が、ひとつ完成するの。……私は、まだ三文字」}
      - {expr: normal, text: 「お客さんも、ひとつ選んでみて。決められなかったら、最初に気になったものが、お客さんの一枚」}

  - place: bd-horo-row
    time: 夕方
    echoes:
      - after: shiori-delivery-1
        label: 朝の話
        lines:
          - {expr: smile, text: 「しおりちゃんのお駄賃は、貝の汁なんだって。案内所でも、いちばん人気。やっぱり、そうなるよね」}
    lines:
      - {who: narration, text: 夕方の幌の下は、串焼きの煙と、汁物の湯気でいっぱいだ。橙と赤の布の下で、人の声が重なっている。}
      - {expr: smile, text: 「幌通り！　食べ歩きの本番は、ここから！　最初の一本は、迷わず串焼き。これが、初心者の一本目」}
      - {expr: tease, text: 「次は、貝の汁を一杯。それから、甘いもので締める。この順番を守ると、おなかが最後まで元気」}
      - {expr: normal, text: 「この通りは、板のすき間から水面がちらちら見えるの。落とした串は、魚が持っていくから、気にしないで」}
      - {expr: smile, text: 「……ね、おいしい？　その顔が見たくて、案内人をやってるんだよ」}

  - place: bd-oyogiba
    time: 日没前
    echoes:
      - after: tsuyu-night-1
        label: 夜の話
        lines:
          - {expr: normal, text: 「日が沈むと、夜の見回りの人たちの時間。灯籠舟の桟橋の端で、灯りの数を数えてる子がいたら、それが夜番のつゆちゃん」}
    lines:
      - {who: narration, text: 桟橋の南の端から、昔の外階段が、そのまま水の中へ続いている。夕日が、水面をオレンジに染めていた。}
      - {expr: normal, text: 「ここが、泳ぎ段。今日の、最後の場所」}
      - {expr: smile, text: 「朝は子どもたちの泳ぎ場で、昼は潜りの練習場。夕方は、足だけつけて、一日を終える場所」}
      - {expr: quiet, text: 「段に腰かけて、足を水につけると、ずっと下の街の屋根が見えるの。……今日、歩いたところも、ぜんぶ」}
      - {expr: normal, text: 「日が沈んだら、遊泳は禁止。夜の荷舟から、泳いでる人が見えなくなっちゃうから」}
      - {expr: tease, text: 「でも、日没は、もうすぐ。そしたら、灯籠舟の夕市が始まるよ。夜のみぎわ市も、また見に来てね」}
      - {expr: smile, text: 「今日は、一日、ありがとう！　お客さんの『楽しい』を、ひとつ見つけられたなら、案内人の勝ちです」}
