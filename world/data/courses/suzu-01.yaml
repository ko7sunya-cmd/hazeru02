# コース: すずの雨上がり
# 上層（あがり）を、雨上がりの朝から夕方まで歩く。天気をめぐる、静かな一日。
# 表情は normal / smile のみ使う（すずの絵がその2種のため）。
id: suzu-garden-1
order: 4
character: suzu
title: すずの雨上がり
subtitle: 屋上の庭から、水平線まで
duration: 約10分
summary: 雨が上がった朝の屋上庭から、夕方の水平線デッキまで。庭師と、上の街で天気の答え合わせをする一日。
steps:
  - place: up-rain-garden
    time: 雨上がりの朝
    lines:
      - {who: narration, text: 雨が上がったばかりの屋上の庭。葉の上の滴と、送気塔の白い湯気が、いっしょに光っている。}
      - {expr: normal, text: 「……おはよう。早いね、お隣さん」}
      - {expr: normal, text: 「若葉すず。ここの庭師。雨受けの桶を預かってる」}
      - {who: narration, text: 庭のあちこちに大きな雨受けの桶が置かれ、細い樋が、畑へ水を引いている。}
      - {expr: normal, text: 「今朝は、桶が七分目。野菜には、ちょうどいい量」}
      - {expr: smile, text: 「雨の味で、その日の天気がわかるの。……先生のおばあさんに、覚えさせられた」}
      - {expr: normal, text: 「ひと口、飲んでみる？　……冗談。雨水は、そのまま飲むものじゃない」}
      - {expr: smile, text: 「でも、匂いは嗅いでいいよ。雨上がりの屋上は、新宿でいちばん、いい匂いがする」}
      - {expr: normal, text: 「歩こう。今日は、雨のあとの一日を、辿ってみる」}

  - place: up-lanterns
    time: 昼前
    lines:
      - {who: narration, text: 塔の壁を覆う灯幕が、昼の明るさのなかで、潮位と天気予報を映している。夜のような色はなく、白い光が淡く並んでいた。}
      - {expr: normal, text: 「昼の灯幕は、静か。夜になると色が変わるけど、昼は、潮位と天気だけ」}
      - {expr: normal, text: 「ほら、『午後から晴れ』って出てる。……わたしの舌は、『夕方まで、薄曇り』って言ってるけど」}
      - {expr: smile, text: 「どっちが当たるか、夕方に答え合わせ。これが、毎日の、ひそかな楽しみ」}
      - {expr: normal, text: 「あの隅の、小さい文字。誰かの伝言なんだよ。『明日の朝市、野菜多め』って」}
      - {expr: smile, text: 「わたしの苗の、宣伝。……ちょっと、照れる」}
    detour:
      place: up-horizon
      label: 水平線デッキの下見をする
      lines:
        - {who: narration, text: 塔の最上部で、アンテナが風にかすかに揺れている。展望床には、まだ誰もいない。}
        - {expr: normal, text: 「ここが、今日の最後の場所。風が強い日は、閉まってるんだけど、今日は、開いてる」}
        - {expr: smile, text: 「夕方に、また来よう。答え合わせは、ここでするって、決めてるの」}

  - place: up-dome-plaza
    time: 昼
    echoes:
      - after: himari-market-1
        label: 案内所の話
        lines:
          - {expr: normal, text: 「案内所のひまりは、初めてのお客さんを、まずここに連れてくるんだって。噴水の水が下から来てるって話、いつも楽しそうにしてる」}
    lines:
      - {who: narration, text: 円いガラス屋根の下の浅い水盤に、空と雲が、そっくり映っている。子どもたちが、裸足で水の中を歩いていた。}
      - {expr: normal, text: 「水鏡ドーム。水盤が空を映すから、雲が、足元を通るの」}
      - {expr: smile, text: 「雨が降ると、ここの水位が上がる。晴れると、少し下がる。……水盤は、空の帳簿みたいなもの」}
      - {expr: normal, text: 「噴水の水は、下の街から来てるんだって。濾し貝に濾されて、すごく澄んでる。雨の水とは、味が違うの」}
      - {expr: normal, text: 「ここで、昼ごはん。ベンチで、屋上の野菜を挟んだパン。……あげないよ」}
      - {expr: smile, text: 「……半分なら、いいよ」}
    detour:
      place: up-hatsukui
      label: 初杭の「床の年輪」を見る
      lines:
        - {who: narration, text: 大桟橋のまんなかに、腰の高さだけ頭を出した、黒くつやつやの杭がある。床板の色が、杭を中心に、年輪のように変わっていた。}
        - {expr: normal, text: 「初杭。ここから、床が外へ広がっていったの。色の違いが、継ぎ足された年代」}
        - {expr: smile, text: 「庭の土も、同じ。古い畑ほど、色が濃い。……時間が、土に沈んでる」}
        - {expr: normal, text: 「手を、置いてみて。わたしは、毎朝、ここで天気を聞く」}

  - place: up-hoshiba
    time: 午後
    lines:
      - {who: narration, text: 海からの風がまっすぐ抜ける細い路地に、洗濯物の旗がはためいている。軒先には、猫が一匹ずつ座っていた。}
      - {expr: normal, text: 「干し場横丁。風が通るから、洗濯物がよく乾く。……猫も、風が通る場所を、知ってる」}
      - {expr: smile, text: 「ここの猫は、十三匹。数えるたびに、どこかの一匹が入れ替わってるの」}
      - {expr: normal, text: 「あの駄菓子屋の奥さんは、わたしの苗の、いちばんのお客さん。トマトが好き」}
      - {expr: normal, text: 「洗濯物の揺れる向きで、風の強さがわかる。庭師には、ちょうどいい時計」}
      - {expr: smile, text: 「……猫の機嫌も、読める。いまは、ご機嫌。少し、撫でてあげて」}

  - place: up-shiomi
    time: 夕方前
    lines:
      - {who: narration, text: 星の紋章を掲げた塔の壁を、光の帯が縦に走っている。潮が満ちるにつれて、帯は、ゆっくり上へ伸びていた。}
      - {expr: normal, text: 「潮見塔。光の帯が、潮の高さ。いまは、七分目」}
      - {expr: normal, text: 「雨が降ると、潮も少し変わる。庭の水が、巡りめぐって、最後は、ここに戻ってくるの」}
      - {expr: smile, text: 「だから、庭師も、潮見をする。……お隣さんも、帯の高さを覚えて帰ってね」}
      - {expr: normal, text: 「看板の読み方、教えようか。『七分』は、いま。『満ち』は、これから」}

  - place: up-horizon
    time: 夕方
    echoes:
      - after: tsuyu-night-1
        label: 夜番の話
        lines:
          - {expr: normal, text: 「夜番のつゆは、日が沈んだら、下の街。……上の灯幕が明るい夜ほど、下の灯りも強いって話、広めたのは、たぶん、わたし」}
          - {expr: smile, text: 「本当かどうかは、知らない。でも、そうだったら、いいなって」}
    lines:
      - {who: narration, text: 新都市でいちばん高い展望床。足元には屋根と庭が広がり、その外側は、見渡すかぎりの水だった。}
      - {who: narration, text: 夕日が、水平線の向こうの水上町と、水面から頭だけ出した遠くの塔を、赤く染めていく。}
      - {expr: normal, text: 「答え合わせ、しようか。灯幕は、『午後から晴れ』。わたしの舌は、『夕方まで、薄曇り』」}
      - {expr: normal, text: 「……見て。西の空、少しだけ、雲が残ってる」}
      - {expr: smile, text: 「わたしの、勝ち。……ほんの、少しだけね」}
      - {expr: normal, text: 「ここにいる時間が、いちばん好きかも。一日のぜんぶが、ここから見えるから」}
      - {expr: normal, text: 「雨も、庭も、猫も、潮も。ぜんぶ、つながってる。……お隣さんが歩いてくれたから、今日は、それがよく見えた」}
      - {expr: smile, text: 「また、雨上がりに。そのときは、庭の野菜を、ひとつ持たせてあげる」}
