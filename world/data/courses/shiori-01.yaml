# コース: しおりの配達日和
# steps は本線。各 step の detour は、隣の場所へ寄り道する任意の分岐（終わると本線へ戻る）。
# lines の who: は省略するとキャラ本人、narration は地の文。expr はキャラの expressions にある表情ID。
id: shiori-delivery-1
order: 1
character: shiori
title: しおりの配達日和
subtitle: 底から空まで、配達について歩く一日
duration: 約10分
summary: 水底の郵便局から、上層の最初の杭まで。宛名のない手紙を連れて、配達人と一日を歩く。
steps:
  - place: lo-post
    time: 朝
    echoes:
      - after: tsuyu-night-1
        label: 夜番の話
        lines:
          - {expr: normal, text: 「この局の朝は、夜番の潜守が帰ってくる時間でもあるの。凪野つゆ……今日は、もう上がったみたい」}
          - {expr: smile, text: 「机の上の点検帳に、几帳面な字で『異常なし』って書いてある。つゆの字。見ると、ちょっと安心する」}
    lines:
      - {who: narration, text: 底郵便局の窓口の奥で、気送管の筒が、ことん、ことんと落ちてくる。上の街から届く朝いちばんの便だ。}
      - {expr: smile, text: 「あ、来た来た。同行の人だよね？　紙谷しおり、配達人の三年目。今日はよろしく」}
      - {expr: normal, text: 「ルールはひとつだけ。配達の邪魔はしないこと。それ以外は、道草、大歓迎」}
      - {who: narration, text: 手紙を鞄にそろえる彼女の肩の上で、小さな配達機が丸いレンズをちかっと光らせた。}
      - {expr: normal, text: 「この子はマル。運び虫っていう、軽い荷物専用の配達機。気送管が届かない屋上は、マルの担当なんだ」}
      - {expr: quiet, text: 「それと、これ」}
      - {who: narration, text: 棚の奥から、宛名のない古い封筒がそっと取り出される。紙は少し黄ばんで、角が丸くなっていた。}
      - {expr: quiet, text: 「宛先不明の棚の、いちばん古い一通。捨てるわけにもいかないから、毎年、誰かが一日だけ連れ歩くの。今年は、私の番」}
      - {expr: smile, text: 「というわけで、今日の配達は七通と、小包がひとつ。と、これ。まずは上へ向かうよ」}

  - place: lo-concourse
    time: 朝
    echoes:
      - after: tsuyu-night-1
        label: 夜番の話
        lines:
          - {expr: quiet, text: 「ここ、夜はつゆの担当。夜の発車標は、動かない日が多いんだって」}
          - {expr: normal, text: 「見たことないな、夜の大広間。いつか、昼の私と夜のあの子で、同じ場所の話をしてみたい」}
    lines:
      - {who: narration, text: 降り筒の乗り場へ向かう途中、旧駅舎の大広間を抜ける。窓の外を、魚の群れが列車のように横切っていく。}
      - {expr: normal, text: 「ここ、朝がいちばん好き。まだ人が少なくて、足音が天井まで届くんだ」}
      - {expr: surprise, text: 「あ、見て、あの発車標。ときどき勝手に行き先が変わるの。今日は……読めない駅名だね。いつものこと」}
      - {expr: tease, text: 「ちょっとだけ寄っていい？　透き廊の窓、今朝は潜守さんが磨いてるはずなんだ。挨拶だけ」}
    detour:
      place: lo-sukiro
      label: 透き廊へ寄り道する
      lines:
        - {who: narration, text: ガラスの廊下の向こうで、潜守が長い柄のブラシを握り、天井の窓をゆっくり磨いている。}
        - {expr: smile, text: 「おはようございまーす！　今朝は厚めに付いてますね」}
        - {who: narration, text: 潜守が手を振り返す。磨かれたガラスの外を、泡の粒が光の筋になって昇っていく。}
        - {expr: quiet, text: 「磨いた直後のガラスって、水の色が一段だけ濃く見えるの。気づいたの、去年なんだけどね」}

  - place: bd-orizutsu
    time: 朝
    lines:
      - {who: narration, text: ガラスの籠が上へ動きだす。外の色が、深い青から緑へ、そして白い光へとほどけていく。}
      - {expr: normal, text: 「降り筒って、上りのほうが好き。水から出る瞬間に、耳がふっと軽くなるでしょ？」}
      - {expr: quiet, text: 「ほんの数秒だけ、上も下もない場所にいる感じがするんだ。……あ、水面だ」}
      - {who: narration, text: 籠の扉が開くと、潮の匂いと、遠くの呼び込みの声が一度に流れ込んできた。}

  - place: bd-crane
    time: 朝
    echoes:
      - after: himari-market-1
        label: 案内所の話
        lines:
          - {expr: smile, text: 「そうだ、案内所のひまりが、初めてのお客さんには、まずここを見せるんだって。赤鶴を見上げる顔が、いちばん素直らしい」}
    lines:
      - {who: narration, text: 舟溜まりの真ん中で、赤い長い首のクレーンが、木箱をゆっくり持ち上げている。}
      - {expr: smile, text: 「赤鶴！　朝の荷揚げ、見ていく？　笛の合図と腕の動きだけで、重い箱がぴたっと台車に収まるの」}
      - {who: narration, text: 笛が短く二度鳴ると、箱は寸分の狂いもなく、台車の上に降りた。}
      - {expr: normal, text: 「ね？　あの中に、私が受け取る小包がひとつ入ってるはず。水上町から来た乾物だよ」}
      - {expr: tease, text: 「それとね、赤鶴は年に一度だけ、首を北に向けてる朝があるんだって。見た人は、その年は豊漁。……私は、まだ見てない」}
    detour:
      place: bd-waterbus
      label: 水上バスのりばへ寄り道する
      lines:
        - {who: narration, text: 屋根のついた待合所の壁に、潮の時刻に合わせてずれていく時刻表が貼ってある。}
        - {expr: normal, text: 「見て、いちばん下の行。行き先が書いてない便が一本だけあるでしょ」}
        - {expr: tease, text: 「乗った人に聞くとね、なぜか誰に聞いても楽しそうに話すの。……私は仕事があるから、まだ乗ったことないけど」}

  - place: bd-horo-row
    time: 昼
    echoes:
      - after: himari-market-1
        label: 案内所の話
        lines:
          - {expr: tease, text: 「ひまりは、この通りの串焼きを『初心者の一本目』って勧めてる。私は、貝の汁派なんだけど」}
          - {expr: normal, text: 「どっちも間違いじゃない。好みは、人の数だけある」}
    lines:
      - {who: narration, text: 昼どきの幌の下は、串焼きの煙と貝の汁の湯気でいっぱいだ。橙と赤の布が、潮風にゆるく揺れている。}
      - {expr: smile, text: 「はい、乾物の箱、お届けでーす！　……おじさん、今日もいい匂い」}
      - {who: narration, text: 屋台の主人は箱を受け取ると、お礼に熱い貝の汁をふたつ、湯気ごと差し出した。}
      - {expr: smile, text: 「配達のお駄賃は、だいたい食べ物。これがいちばん嬉しいんだ」}
      - {expr: normal, text: 「ふーふーして飲むと、潮の味のあとに、ほんのり甘みが来るの。濾し貝の出汁って、そういうものらしいよ」}
      - {expr: quiet, text: 「そういえば、さっきの宛名のない手紙。封筒の端に、小さな印があるんだ。魚の形。底郵便局の消印に似てるけど、少しだけ違う」}
      - {expr: tease, text: 「……向かいの沈み物市、のぞいていかない？　手がかり、あるかもしれない」}
    detour:
      place: bd-shizumimono
      label: 沈み物市へ寄り道する
      lines:
        - {who: narration, text: 台の上に、洗われた古い切符、止まった腕時計、看板から外れた一文字が並んでいる。小さな札がひとつずつ付いていた。}
        - {expr: surprise, text: 「あ、魚のスタンプ！……ううん、これは別物かあ。形は近いんだけどな」}
        - {expr: smile, text: 「でも、いい。探してるときのほうが、いろんなものが見える気がするから」}

  - place: up-kuimi
    time: 午後
    lines:
      - {who: narration, text: 幌通りの端から、杭見坂の木の階段が空へ向かって伸びている。手すりのすぐ脇を、杭の林が流れていく。}
      - {expr: normal, text: 「この坂ね、杭に巻いてある帯が、下へ行くほど古い色なの。上りだと、時間がだんだん若返っていく感じがしない？」}
      - {expr: smile, text: 「マル、先に屋上の三通、お願い！」}
      - {who: narration, text: 小さな配達機が羽音を立てて、手紙を抱えたまま空へ上がっていった。陽ざしの中で、レンズがひとつ光った。}
      - {expr: normal, text: 「私たちは階段で行こう。……息、上がってない？　水面が遠くなると、風の匂いがちょっと変わるでしょ」}

  - place: up-hatsukui
    time: 夕方
    echoes:
      - after: suzu-garden-1
        label: 庭師の話
        lines:
          - {expr: normal, text: 「この杭のそばで、夕方によく空を見上げてる子がいるの。屋上庭の庭師の、若葉すず。雨の味で、天気を当てるんだって」}
          - {expr: tease, text: 「私が手紙を置く時間は、いつも見られてるかも。……見られても、困らないけど」}
    lines:
      - {who: narration, text: 大桟橋テラスのまんなかに、床から腰の高さだけ頭を出した、黒くつやつやの杭がある。夕方の光が、床板の年輪を金色に染めていた。}
      - {expr: quiet, text: 「着いた。ここが、今日の最後の寄り道」}
      - {expr: normal, text: 「初杭。引っ越してきた日と、旅立つ日に、ここに手を置くのが決まりなんだ。私も、三年前に置いたよ」}
      - {who: narration, text: しおりは鞄から、あの宛名のない封筒を取り出して、杭の上にそっと置いた。}
      - {expr: quiet, text: 「連れ歩くのは、一日だけ。夜になるまで、ここに置いておくの」}
      - {expr: quiet, text: 「朝になるとね、いつもなくなってる。誰が持っていくのかは、知らない。知らなくていいかなって、最近は思ってる」}
      - {expr: surprise, text: 「あ、耳、当ててみて。……聞こえた？　電車が走りだす音」}
      - {expr: smile, text: 「子どものころは、本気で信じてたんだ。いまは、半分だけ」}

  - place: up-lanterns
    time: 夜
    echoes:
      - after: suzu-garden-1
        label: 庭師の話
        lines:
          - {expr: smile, text: 「この通りの天気予報、すずはあんまり信じてないんだって。自分の舌のほうが当たるって、勝負してるらしいよ」}
    lines:
      - {who: narration, text: 日が落ちると、塔の壁の灯幕が、ゆっくり色を変えはじめる。光は桟橋のすき間から水面へ落ちて、境界の市場の天井をほんのり染めた。}
      - {expr: smile, text: 「配達、おしまい！　今日は一緒に歩いてくれて、ありがとう」}
      - {expr: normal, text: 「ほら、幕に出てるの、今日の潮位と、誰かの誕生日のお祝い。ああいうのを読みながら帰るのが、私の仕事終わりの楽しみ」}
      - {expr: tease, text: 「またおいで。次は、違う道を案内するから。道草のほうが長くなっても、怒らないでね」}
      - {who: narration, text: 彼女は鞄を肩にかけ直して、手を振った。足元で、配達機がふわりと光った。}
