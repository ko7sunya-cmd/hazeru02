# コース: つゆの夜番
# しおりの「昼・上へ・賑やか」に対して、「夜・下へ・静か」のコース。
# 表情は normal / smile / quiet のみ使う（つゆの絵がその3種のため）。
id: tsuyu-night-1
order: 2
character: tsuyu
title: つゆの夜番
subtitle: 灯魚が灯るまでの、静かな見回り
duration: 約10分
summary: 日没の水上の市から、水底の無音の間まで。夜番の潜守と、点検の見回りを歩く。
steps:
  - place: bd-lantern
    time: 日没
    echoes:
      - after: himari-market-1
        label: 案内所の話
        lines:
          - {expr: normal, text: 「……昼に、案内所の子が、ここの灯籠舟の話をしていた。『夜は、つゆちゃんに聞いて』って」}
          - {expr: quiet, text: 「人に勧めるの、上手な子。……わたしは、そういうの、苦手」}
    lines:
      - {who: narration, text: 日没の鐘が、水の上を渡っていく。輪の間の南の水面に、灯籠を吊るした小舟が、ひとつ、またひとつと集まってくる。}
      - {expr: normal, text: 「……あなたが、同行者？　話は聞いてる。凪野つゆ。夜番の潜守」}
      - {expr: normal, text: 「夜の見回りについてくるだけ。それなら、別にいい。静かにしてくれるなら」}
      - {who: narration, text: つゆは舟には乗らず、桟橋の端に立ったまま、灯籠の数を目で数えている。灯りが水面に映って、細く長くのびていた。}
      - {expr: normal, text: 「満月の晩だけ、一艘多いって言われてる。今日は満月じゃない。……数は、合ってる」}
      - {expr: quiet, text: 「夜は、始まる前がいちばん静か。灯りが全部そろうまでの、少しのあいだ」}
      - {expr: smile, text: 「あなた、歩くの、ゆっくり？　……なら、ちょうどいい。夜は急がないから」}
      - {expr: normal, text: 「降りるよ。灯りは、下にもあるから」}

  - place: bd-orizutsu
    time: 夜
    lines:
      - {who: narration, text: ガラスの籠が降りていく。夜の水は昼より濃い青で、遠くの灯籠の光だけが、揺れながら上へ遠ざかっていった。}
      - {expr: normal, text: 「夜の降り筒は、乗る人がほとんどいない。ほとんど、貸し切り」}
      - {expr: quiet, text: 「降りるとき、いつも思う。光が小さくなるほど、音も小さくなるって。……あなたは、どう？」}
      - {who: narration, text: 籠の外を、はぐれた灯魚が一匹、ゆっくりとついてくる。小さな体が、うっすら青白く光っていた。}
      - {expr: normal, text: 「あれは、迷子。大丈夫、だいたい戻る」}

  - place: lo-concourse
    time: 夜
    echoes:
      - after: shiori-delivery-1
        label: 朝の話
        lines:
          - {expr: normal, text: 「朝の配達人が、この広間が好きって言ってたらしい。朝がいちばん好き、って」}
          - {expr: smile, text: 「……わかる。わたしは夜のほうが好きだけど、朝の足音の響き方は、きっと、いい」}
    lines:
      - {who: narration, text: 夜の大広間は、昼とは別の場所のようだった。青い常夜灯が床に落ち、窓の外では魚たちが、眠る前の、ゆっくりした列で泳いでいる。}
      - {expr: normal, text: 「ここの夜は、人が少ない。足音がしないから、魚の音が聞こえる気がする。……聞こえないけど」}
      - {expr: normal, text: 「発車標、見て。今夜は、動かない日みたい。……動くところ、見たかった？」}
      - {expr: quiet, text: 「見られなかったなら、それでいい。見られなかった夜も、悪くない」}
      - {expr: normal, text: 「光井戸、寄る？　夜は、光の柱がない。なにもないけど。……わたしは、そこが好き」}
    detour:
      place: lo-light-well
      label: 光井戸へ寄り道する
      lines:
        - {who: narration, text: ビルの谷間の底に立って見上げると、四角く切り取られた夜空に、星がいくつか浮かんでいる。昼の光の柱は、そこにはなかった。}
        - {expr: quiet, text: 「昼は、人が集まる場所。夜は、わたしひとりのことが多い」}
        - {expr: quiet, text: 「でも、昼に落ちた光が、まだ水の中に残ってる気がする。……気のせい」}
        - {expr: smile, text: 「付き合ってくれて、ありがとう。……別に、礼を言うほどのことじゃないけど」}

  - place: lo-sukiro
    time: 夜
    lines:
      - {who: narration, text: ガラスの廊下は、夜になると鏡のようになる。歩く二人と、並んで泳ぐ魚の影が、ガラスの上に重なって映る。}
      - {expr: normal, text: 「点検の順番は、決まってる。この廊下は、継ぎ目を右手でなぞって歩く」}
      - {who: narration, text: つゆは壁に指を滑らせ、ある継ぎ目のところで、ほんの一瞬だけ手を止めた。}
      - {expr: normal, text: 「ここ。少し、冷たい。……大丈夫、異常じゃない。夜は水温が下がるだけ」}
      - {expr: quiet, text: 「点検って、直すより、聞くことのほうが多い。建物の、小さな音を」}
      - {expr: normal, text: 「昔の構内放送が聞こえるって噂、知ってる？　わたしも聞いたことがある。……五回に一回くらい」}

  - place: lo-train-gallery
    time: 夜
    lines:
      - {who: narration, text: 封水された旧ホームが、細長い展示室になっている。窓の外の線路には、昔の車両が、止まったときのまま並んでいた。夜には、それぞれの車内で、灯魚の淡い光が点々と灯る。}
      - {expr: normal, text: 「窓の外、いちばん端の車両。灯りがついてるでしょ」}
      - {expr: normal, text: 「あの車両だけは、灯りが消えたことがない。電気は、どこからも来てないのに。点検の記録には、『異常なし』って書いてある」}
      - {expr: quiet, text: 「異常じゃないの。ずっと、ああいうもの。誰も困ってない」}
      - {expr: smile, text: 「わたしは、あの灯りを見てから、夜の見回りを始める。……挨拶みたいなもの」}
      - {expr: normal, text: 「窓のいちばん奥、見える？　青く沈んだホームの端。濾し貝の苗床で、立ち入りは潜守だけ」}
      - {expr: quiet, text: 「そこで発車ベルが鳴るのを聞いた潜守は、その年いちばんの貝を育てるって。……わたしは、まだ聞いたことない」}
      - {expr: normal, text: 「苔の地下街、行ってみる？　案内つきでしか入れないから。わたしが案内する」}
    detour:
      place: lo-moss-arcade
      label: 苔の地下街へ、つゆの案内で
      lines:
        - {who: narration, text: 通路の灯りが落とされると、苔がほのかに緑に光りはじめた。壁にも天井にも柔らかな苔が広がり、その下から、昔の店の名前が少しだけ透けている。}
        - {expr: normal, text: 「ここは、案内つきでしか入れない。迷うから。……わたしは、毎回、少し違う道を通る」}
        - {expr: quiet, text: 「でも、必ず同じ出口に着く。理由は、知らない。知らなくていいと思ってる」}
        - {expr: smile, text: 「苔の光は、まっすぐ見るより、横目で見たほうがきれい。やってみて」}
        - {who: narration, text: 言われたとおり視線を少しずらすと、通路の奥で、緑の光がふわりと濃くなった。}

  - place: lo-hikari-tower
    time: 夜
    echoes:
      - after: suzu-garden-1
        label: 庭師の話
        lines:
          - {expr: normal, text: 「上の街の灯幕が明るい夜ほど、ここの光も強くなる……って話、屋上庭の庭師から聞いた。すず、だったかな」}
          - {expr: quiet, text: 「本当かどうか、聞いたことはない。聞かないほうが、いい気がして」}
    lines:
      - {who: narration, text: 沈んだ塔の窓が、ひとつ、またひとつと灯っていく。淡い青白い光は、灯魚の群れがいっせいにまとったものだ。}
      - {expr: normal, text: 「始まった。毎晩、日没のおよそ二時間あと」}
      - {expr: normal, text: 「わたしは、ここで灯魚の数を数える。数えなくてもいいんだけど、数えると、安心する」}
      - {who: narration, text: 窓の奥で、光る群れが渦を巻きながら昇っていく。赤い看板の下の窓まで、光は途切れずに続いた。}
      - {expr: quiet, text: 「上の街の灯幕が明るい夜ほど、ここの光も強くなる。上と下で、光の挨拶をしてるんだって」}
      - {expr: smile, text: 「……いい話だと思う。本当かどうかは、どうでもいい」}
      - {expr: normal, text: 「今夜の数は、いつもと同じ。それが、いちばん嬉しい」}

  - place: lo-quiet-hall
    time: 夜
    lines:
      - {who: narration, text: 無音の間の扉の前で、つゆは足を止めた。}
      - {expr: normal, text: 「ここは、話さない決まり。入ったら、おしまい」}
      - {expr: quiet, text: 「見回りの最後は、いつもここ。窓辺に座って、少しだけ、何もしない」}
      - {expr: smile, text: 「今日は、ありがとう。……ここからは、言葉はいらないから」}
      - {who: narration, text: 扉が静かに開く。外の音が、ふっと遠くなった。}
      - {who: narration, text: 青い光の中を、魚がゆっくり横切っていく。窓辺に並んで座った二人のあいだに、言葉はなかった。}
      - {who: narration, text: やがて、つゆが、ほんの少しだけ、こちらへ肩を寄せた。}
